name: Jira & AWS S3 Governance Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  governance-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Validate Jira Ticket ID in Commit Message
        id: check_jira
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Checking commit: $COMMIT_MSG"
          if [[ "$COMMIT_MSG" =~ ^(SCRUM-[0-9]+): ]]; then
            JIRA_KEY="${BASH_REMATCH[1]}"
            echo "jira_key=$JIRA_KEY" >> $GITHUB_OUTPUT
            echo "✅ Validated Jira Ticket: $JIRA_KEY"
          else
            echo "❌ Governance Gate Failed: Commit message must start with SCRUM-<number>:"
            exit 1
          fi

      - name: 2. Post Deployment Comment to Jira Ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.check_jira.outputs.jira_key }}
        run: |
          COMMENT_TEXT="Automated Governance Check Passed: Commit ${{ github.sha }} pushed by ${{ github.actor }}."
          PAYLOAD=$(jq -n --arg txt "$COMMENT_TEXT" '{
            body: {
              type: "doc",
              version: 1,
              content: [{
                type: "paragraph",
                content: [{ type: "text", text: $txt }]
              }]
            }
          }')
          curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_KEY/comment"

      - name: 3. Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: 4. Upload Compliance Audit Log to S3
        env:
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          JIRA_KEY: ${{ steps.check_jira.outputs.jira_key }}
        run: |
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          AUDIT_FILE="audit-${JIRA_KEY}-${TIMESTAMP}.json"
          jq -n \
            --arg jira "$JIRA_KEY" \
            --arg sha "${{ github.sha }}" \
            --arg actor "${{ github.actor }}" \
            --arg repo "${{ github.repository }}" \
            --arg time "$TIMESTAMP" \
            '{
              jira_ticket: $jira,
              commit_sha: $sha,
              author: $actor,
              repository: $repo,
              status: "COMPLIANT",
              timestamp_utc: $time
            }' > "$AUDIT_FILE"
          aws s3 cp "$AUDIT_FILE" "s3://$S3_BUCKET/audit-logs/$AUDIT_FILE"
          echo "✅ Uploaded $AUDIT_FILE to S3"

